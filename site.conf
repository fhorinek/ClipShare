<VirtualHost *:80>
    ServerName clip.horinek.sk
    ServerAlias www.clip.horinek.sk

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName clip.horinek.sk
    ServerAlias www.clip.horinek.sk

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/clip.horinek.sk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/clip.horinek.sk/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/clip.horinek.sk-error.log
    CustomLog ${APACHE_LOG_DIR}/clip.horinek.sk-access.log combined
</VirtualHost>
</IfModule>
